<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>404 - Ceci n'est pas une page</title>
	<style>
		:root {
			--wall: #efe9df;
			--wall-shadow: #ddd4c4;
			--canvas: #f8f4ec;
			--frame: #8a6a3f;
			--frame-dark: #5e4626;
			--ink: #2b2620;
			--muted: #6f6556;
			--accent: #b5452f;
			--pipe: #6b3f24;
			--pipe-dark: #3d2414;
			--stem: #1f1a16;
		}

		@media (prefers-color-scheme: dark) {
			:root {
				--wall: #1c1a17;
				--wall-shadow: #121110;
				--canvas: #ece5d8;
				--frame: #9b7a48;
				--frame-dark: #6a5130;
				--ink: #f0e9dc;
				--muted: #b3a894;
				--accent: #e0775f;
			}
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 2rem;
			padding: 2rem 1rem;
			background: radial-gradient(ellipse at top, var(--wall) 40%, var(--wall-shadow) 100%);
			color: var(--ink);
			font-family: Georgia, "Times New Roman", serif;
			text-align: center;
		}

		/* The gallery spotlight above the painting */
		.spotlight {
			position: fixed;
			top: -30vh;
			left: 50%;
			width: 90vmin;
			height: 90vmin;
			transform: translateX(-50%);
			background: radial-gradient(circle, rgba(255, 244, 214, 0.35) 0%, transparent 65%);
			pointer-events: none;
		}

		.painting {
			position: relative;
			width: min(560px, 100%);
			padding: clamp(14px, 3vw, 24px);
			background: linear-gradient(135deg, var(--frame) 0%, var(--frame-dark) 100%);
			border-radius: 4px;
			box-shadow:
				inset 0 0 0 2px rgba(255, 255, 255, 0.15),
				0 25px 50px -12px rgba(0, 0, 0, 0.45);
			animation: hang 1.2s ease-out both;
			transform-origin: top center;
		}

		.canvas {
			background: var(--canvas);
			padding: clamp(1.5rem, 6vw, 3rem) clamp(1rem, 4vw, 2.5rem);
			box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.12);
		}

		.pipe {
			width: 100%;
			max-width: 380px;
			height: auto;
			display: block;
			margin: 0 auto;
		}

		.smoke path {
			fill: none;
			stroke: #9a9187;
			stroke-width: 3;
			stroke-linecap: round;
			opacity: 0;
			animation: smoke 4s ease-in-out infinite;
		}

		.smoke path:nth-child(2) { animation-delay: 1.3s; }
		.smoke path:nth-child(3) { animation-delay: 2.6s; }

		.caption {
			margin-top: 1.5rem;
			font-family: "Brush Script MT", "Segoe Script", "Comic Sans MS", cursive;
			font-size: clamp(1.6rem, 6vw, 2.4rem);
			color: #2b2620;
		}

		.label {
			width: min(360px, 100%);
			padding: 1rem 1.25rem;
			background: #fffdf8;
			color: #2b2620;
			border: 1px solid #d9d0bf;
			box-shadow: 0 6px 16px -8px rgba(0, 0, 0, 0.35);
			text-align: left;
			font-size: 0.95rem;
			line-height: 1.5;
		}

		.label .code {
			font-size: 2.25rem;
			font-weight: bold;
			letter-spacing: 0.05em;
			color: var(--accent);
			line-height: 1;
		}

		.label .title {
			font-style: italic;
			margin-top: 0.25rem;
		}

		.label .meta {
			color: #6f6556;
			font-size: 0.85rem;
		}

		.label p + p {
			margin-top: 0.5rem;
		}

		.actions {
			display: flex;
			flex-wrap: wrap;
			gap: 0.75rem;
			justify-content: center;
		}

		.btn {
			display: inline-block;
			padding: 0.7rem 1.4rem;
			border: 2px solid var(--ink);
			border-radius: 999px;
			color: var(--ink);
			text-decoration: none;
			font-family: inherit;
			font-size: 1rem;
			background: transparent;
			cursor: pointer;
			transition: background 0.2s, color 0.2s, transform 0.2s;
		}

		.btn.primary {
			background: var(--ink);
			color: var(--wall);
		}

		.btn:hover,
		.btn:focus-visible {
			transform: translateY(-2px);
			background: var(--accent);
			border-color: var(--accent);
			color: #fff;
			outline: none;
		}

		@keyframes hang {
			0% { transform: rotate(-4deg); opacity: 0; }
			50% { transform: rotate(2deg); opacity: 1; }
			75% { transform: rotate(-1deg); }
			100% { transform: rotate(0deg); }
		}

		@keyframes smoke {
			0% { opacity: 0; transform: translateY(8px); }
			30% { opacity: 0.6; }
			100% { opacity: 0; transform: translateY(-22px); }
		}

		@media (prefers-reduced-motion: reduce) {
			.painting,
			.smoke path {
				animation: none;
			}
			.smoke path {
				opacity: 0.4;
			}
		}
	</style>
</head>
<body>
	<div class="spotlight" aria-hidden="true"></div>

	<main class="painting" aria-labelledby="caption">
		<div class="canvas">
			<svg class="pipe" viewBox="0 0 400 220" role="img" aria-label="A painted tobacco pipe">
				<g class="smoke">
					<path d="M300 70 q-10 -15 0 -30 q10 -15 0 -30"/>
					<path d="M315 72 q-10 -15 0 -30 q10 -15 0 -30"/>
					<path d="M330 70 q-10 -15 0 -30 q10 -15 0 -30"/>
				</g>
				<!-- stem -->
				<path d="M20 120 Q140 112 262 128 L262 146 Q140 134 24 136 Q12 128 20 120 Z" fill="var(--stem)"/>
				<rect x="236" y="124" width="30" height="24" rx="3" fill="#c9a96a"/>
				<!-- bowl -->
				<path d="M262 88 L352 88 Q358 150 330 190 Q300 214 274 196 Q258 182 258 150 Z" fill="var(--pipe)"/>
				<path d="M268 92 L346 92 Q350 140 328 178 Q312 196 296 196 Q326 160 330 92 Z" fill="var(--pipe-dark)" opacity="0.55"/>
				<ellipse cx="307" cy="88" rx="46" ry="10" fill="var(--pipe-dark)"/>
				<ellipse cx="307" cy="88" rx="36" ry="6" fill="#1a0f08"/>
				<path d="M272 110 Q268 150 284 182" stroke="#a8724b" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
			</svg>
			<p class="caption" id="caption">Ceci n'est pas une page</p>
		</div>
	</main>

	<aside class="label">
		<p class="code">404</p>
		<p class="title">La Trahison des URL</p>
		<p class="meta">Oil on server, 2026. On permanent loan from nowhere.</p>
		<p>The page you are looking for is not on display. It may have been moved, renamed, or perhaps it never existed at all.</p>
	</aside>

	<nav class="actions" aria-label="Error page actions">
		<a class="btn primary" href="/">Return to the gallery</a>
		<a class="btn" href="javascript:history.back()">Go back</a>
	</nav>
</body>
</html>
